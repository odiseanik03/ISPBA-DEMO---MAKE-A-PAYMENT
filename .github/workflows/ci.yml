name: accountflow-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r analytics-python/requirements.txt
      - run: PYTHONPATH=analytics-python pytest analytics-python/tests -q -m "not integration"
      - run: python -m compileall analytics-python/app analytics-python/tests

  python-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: accountflow
          POSTGRES_USER: accountflow
          POSTGRES_PASSWORD: accountflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accountflow -d accountflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r analytics-python/requirements.txt
      - run: PYTHONPATH=analytics-python POSTGRES_INTEGRATION=true DATABASE_URL=postgresql+psycopg://accountflow:accountflow@localhost:5432/accountflow pytest analytics-python/tests/test_postgres_integration.py -q

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -q test
        working-directory: backend-java

  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
        working-directory: frontend-flutter
      - run: flutter test
        working-directory: frontend-flutter

  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/bootstrap.sh scripts/demo-smoke.sh scripts/e2e-compose-check.sh scripts/phase-validate.sh scripts/final-phase.sh scripts/validate-contracts.sh

  contracts-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate-contracts.sh

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [python-tests, python-postgres-integration, java-tests, flutter-tests, shell-checks, contracts-sync]
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/e2e-compose-check.sh scripts/demo-smoke.sh
      - run: ./scripts/e2e-compose-check.sh
