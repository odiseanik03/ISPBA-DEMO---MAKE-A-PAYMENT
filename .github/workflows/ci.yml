name: accountflow-ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r analytics-python/requirements.txt
      - run: PYTHONPATH=analytics-python pytest analytics-python/tests -q

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -q test
        working-directory: backend-java

  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
        working-directory: frontend-flutter
      - run: flutter test
        working-directory: frontend-flutter

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [python-tests, java-tests]
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/e2e-compose-check.sh scripts/demo-smoke.sh
      - run: ./scripts/e2e-compose-check.sh
